[project]
name = "selfaudit"
version = "0.1.0"
description = "Audit your own Instagram export for what an impersonation scammer could harvest."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi", "uvicorn", "python-multipart", "pydantic>=2", "httpx",
  "pillow", "numpy", "av", "ollama",
  "presidio-analyzer", "spacy", "gliner",
  "torch", "torchaudio", "speechbrain", "silero-vad", "pyyaml",
  # GLiNER does not declare it, but transformers 5 rebuilds GLiNER's mDeBERTa
  # tokenizer through SentencePieceExtractor, which needs protobuf. Without it
  # the name reader fails to load (pinned by test_real_gliner_loads_and_finds_a_name).
  "protobuf>=7.36.2",
  # spaCy models are not on PyPI. Pinned to the release matching spaCy 3.8 so
  # `uv sync` installs it and nobody has to run `spacy download` by hand.
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = ["pytest"]

# The package must be installed (not just present) for `python -m selfaudit`
# to work from a src/ layout.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Needed for the en-core-web-sm URL dependency above.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/selfaudit"]

# The RTX 50-series (sm_120) needs a recent CUDA build of PyTorch; the default
# PyPI wheel on Windows is CPU-only. If this index has no wheel for Python 3.12,
# use the newest cuXXX index listed at pytorch.org.
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs the local models and the GPU"]
# GPU tests are opt-in (`-m gpu`) so the default run is fast and works anywhere.
addopts = "-m 'not gpu'"
